{% extends "base.html" %}
{% block title %}Register container{% endblock %}
{% block content %}
<div class="page-heading"><div><div class="eyebrow">CARGO REGISTER</div><h1>Register a container</h1><p>Enter container details and the associated cargo information.</p></div><a class="btn btn-outline-primary" href="{{ url_for('containers') }}">← Back to containers</a></div>
<form method="post" class="panel-card form-panel"><div class="form-section-title">Container details</div><div class="row g-3">
<div class="col-md-6"><label class="form-label">Container number *</label><input class="form-control" name="container_number" required placeholder="e.g. SLPU1000005"></div>
<div class="col-md-6"><label class="form-label">Associated vessel</label><select class="form-select" name="vessel_id"><option value="">Not linked yet</option>{% for v in vessels %}<option value="{{ v.id }}">{{ v.name }}{% if v.voyage_number %} — {{ v.voyage_number }}{% endif %}</option>{% endfor %}</select></div>
<div class="col-12"><label class="form-label">Cargo description *</label><input class="form-control" name="cargo_description" required></div>
<div class="col-md-4"><label class="form-label">Container type</label><select class="form-select" name="container_type"><option>20ft</option><option>40ft</option><option>Refrigerated</option><option>Open-top</option><option>Other</option></select></div>
<div class="col-md-4"><label class="form-label">Weight (tonnes)</label><input class="form-control" type="number" step="0.1" min="0" name="weight_tonnes" value="0"></div>
<div class="col-md-4"><label class="form-label">Priority</label><select class="form-select" name="priority">{% for s in ['Normal','High','Urgent'] %}<option>{{ s }}</option>{% endfor %}</select></div>
<div class="col-md-6"><label class="form-label">Current status</label><select class="form-select" name="status">{% for s in ['At port','Discharged','In transit','Ready for collection'] %}<option>{{ s }}</option>{% endfor %}</select></div>
<div class="col-md-6"><label class="form-label">Expected collection</label><input class="form-control" type="datetime-local" name="expected_collection"></div>
</div><div class="form-actions"><button class="btn btn-primary">Save container</button><a class="btn btn-light" href="{{ url_for('containers') }}">Cancel</a></div></form>
{% endblock %}
